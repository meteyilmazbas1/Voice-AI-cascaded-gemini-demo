name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "feat/**" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Syntax check
        run: npm test

      - name: Smoke test (server boot)
        run: npm run test:smoke --if-present

      # run audit once in matrix to reduce noise
      - name: Security audit (high+ prod deps)
        if: matrix.node-version == '22.x'
        run: npm audit --omit=dev --audit-level=high
